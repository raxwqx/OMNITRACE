[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitrace"
version = "0.6.0"
description = "Modular public-source OSINT investigation workspace"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "OMNITRACE contributors" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "SQLAlchemy>=2.1.8,<3.0",
    "dnspython>=2.9.2,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=9.2.0", "pytest-cov>=7.1.0", "httpx>=0.28.1"]
dev = ["pytest>=9.2.0", "pytest-cov>=7.1.0", "httpx>=0.28.1", "ruff>=0.17.5"]
postgres = ["psycopg[binary]>=3.3.9,<4.0"]

[project.urls]
Homepage = "https://github.com/raxwqx/OMNITRACE"
Repository = "https://github.com/raxwqx/OMNITRACE"
Issues = "https://github.com/raxwqx/OMNITRACE/issues"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*"]
