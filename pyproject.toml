[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitrace"
version = "0.6.0"
description = "Modular public-source OSINT investigation workspace"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "OMNITRACE contributors" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "dnspython>=2.6,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.2,<4.0"]

[project.urls]
Homepage = "https://github.com/raxwqx/OMNITRACE"
Repository = "https://github.com/raxwqx/OMNITRACE"
Issues = "https://github.com/raxwqx/OMNITRACE/issues"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*"]
