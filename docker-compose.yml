services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omnitrace
      POSTGRES_USER: omnitrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnitrace -d omnitrace"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  omnitrace:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://omnitrace:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/omnitrace
    restart: unless-stopped

volumes:
  postgres_data:
