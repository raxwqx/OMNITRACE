  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7dffb0"/><stop offset="1" stop-color="#b7ff5c"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1b2c2b" stroke-width="1" opacity=".48"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
