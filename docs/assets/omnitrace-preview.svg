<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">OMNITRACE interface preview</title><desc id="desc">Illustrative preview of the OMNITRACE dark OSINT workspace showing navigation, an intelligence overview, signal cards, and module tiles.</desc>
<defs>
